[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Set the log level for tests
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore specific warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Configure markers
markers =
    core: tests for core functionality
    analytics: tests for analytics functionality
    processors: tests for processors functionality
    exporters: tests for exporters functionality
    visualization: tests for visualization functionality
    api: tests for API functionality 