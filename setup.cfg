[metadata]
name = prolabdep
version = 0.1.0
author = Original Author
author_email = example@example.com
description = Data processing package for wastewater treatment plant analysis
long_description = file: README.md
long_description_content_type = text/markdown
keywords = wastewater, analysis, LIMS
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Topic :: Scientific/Engineering

[options]
packages = find:
python_requires = >=3.7
install_requires =
    pandas>=1.3.0
    numpy>=1.20.0
    matplotlib>=3.4.0
    sqlalchemy>=1.4.0
    flask>=2.0.0
    reportlab>=3.6.0
    openpyxl>=3.0.0
    scipy>=1.8.0
    statsmodels>=0.13.0

[options.extras_require]
dev =
    pytest>=6.0.0
    pytest-cov>=2.12.0
    black>=21.5b2
    isort>=5.9.0
    flake8>=3.9.0
    mypy>=0.812
notebook =
    jupyter>=1.0.0 